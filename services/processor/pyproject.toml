[project]
name = "nixclip-processor"
version = "0.2.0"
description = "Local-first media intelligence and rendering worker for NixClip"
requires-python = ">=3.10,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "opencv-python-headless>=4.10,<5",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
  "yt-dlp>=2025.1.26",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]
vision = ["ultralytics>=8.3,<9"]
diarization = ["pyannote.audio>=3.3,<4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
